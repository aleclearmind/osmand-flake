name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: aleclearmind/nix-android-ci/.github/workflows/build-sign-release.yml@v1
    secrets:
      keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    with:
      title: OsmAnd~~
      apks: |
        [{"attr": ".#apk",     "abi": "arm64-v8a"},
         {"attr": ".#apk-x86", "abi": "x86_64"}]
      tests: |
        [{"attr": ".#route-test",   "name": "Road routing"},
         {"attr": ".#transit-test", "name": "Transit routing"}]
